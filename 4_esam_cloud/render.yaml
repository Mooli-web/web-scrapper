services:
  - type: web
    name: esam-market-intelligence
    env: python
    region: frankfurt
    plan: free
    buildCommand: "pip install -r requirements.txt && cd dashboard && npm install && npm run build"
    startCommand: "uvicorn server.app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ESAM_BASE_URL
        value: https://esam.ir
      - key: CRAWLER_DELAY_SEC
        value: "2.5"
      - key: CRAWLER_TIMEOUT_SEC
        value: "15"
      - key: AUTO_START_CRAWLER
        value: "true"
      - key: AUTH_ENABLED
        value: "false"
